name: Build Kids Video TV-only apps

on:
  push:
    branches: [ kids-video-tv-only-20261018 ]
  workflow_dispatch:

jobs:
  catalog-apps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TV branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare stable family signing key
        run: base64 --decode KidsVideoAndroid/app/kids-test.keystore.b64 > KidsVideoAndroid/app/kids-test.keystore

      - name: Build daughter and son TV APKs
        working-directory: KidsVideoAndroid
        run: gradle --no-daemon clean assembleDaughterDebug assembleSonDebug

      - name: Collect TV catalogue APKs
        run: |
          mkdir -p .kids-tv-build
          cp KidsVideoAndroid/app/build/outputs/apk/daughter/debug/app-daughter-debug.apk .kids-tv-build/Daughter-Video-TV.apk
          cp KidsVideoAndroid/app/build/outputs/apk/son/debug/app-son-debug.apk .kids-tv-build/Son-Video-TV.apk
          ls -lh .kids-tv-build

      - name: Upload Daughter TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Daughter-Video-TV-APK
          path: .kids-tv-build/Daughter-Video-TV.apk
          if-no-files-found: error

      - name: Upload Son TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Son-Video-TV-APK
          path: .kids-tv-build/Son-Video-TV.apk
          if-no-files-found: error

  native-player-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TV branch patches
        uses: actions/checkout@v4

      - name: Set up JDK 11 for SmartTube 32.68
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Install SmartTube Android SDK and NDK
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;30.0.3" \
            "ndk;21.0.6113669"

      - name: Clone pinned SmartTube source with submodules
        run: |
          git clone https://github.com/yuliskov/SmartTube.git SmartTubeEngine
          cd SmartTubeEngine
          git checkout ffa16426ea3c7c82077e0f00228818b85f373588
          git submodule sync --recursive
          git submodule update --init --recursive
          chmod +x gradlew
          git rev-parse HEAD

      - name: Apply Kids TV player-only patch
        run: python3 .kids-tv-engine/patch_smarttube.py

      - name: Build ARMv7 native TV engine
        working-directory: SmartTubeEngine
        run: ./gradlew --no-daemon assembleStstableDebug

      - name: Collect ARMv7 engine APK
        run: |
          mkdir -p .kids-tv-engine-out
          ENGINE_APK=$(find SmartTubeEngine/smarttubetv/build/outputs/apk -type f -name '*armeabi-v7a.apk' | head -n 1)
          test -n "$ENGINE_APK"
          cp "$ENGINE_APK" .kids-tv-engine-out/Kids-TV-Player-Engine.apk
          ls -lh "$ENGINE_APK" .kids-tv-engine-out/Kids-TV-Player-Engine.apk

      - name: Upload native TV player engine
        uses: actions/upload-artifact@v4
        with:
          name: Kids-TV-Player-Engine-ARMv7
          path: .kids-tv-engine-out/Kids-TV-Player-Engine.apk
          if-no-files-found: error
