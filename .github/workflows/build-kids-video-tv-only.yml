name: Build Kids Video TV-only apps

on:
  push:
    branches: [ kids-video-tv-only-20261018 ]
  workflow_dispatch:

jobs:
  catalog-apps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TV branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare stable family signing key
        run: base64 --decode KidsVideoAndroid/app/kids-test.keystore.b64 > KidsVideoAndroid/app/kids-test.keystore

      - name: Build daughter and son TV APKs
        working-directory: KidsVideoAndroid
        run: gradle --no-daemon clean assembleDaughterDebug assembleSonDebug

      - name: Collect TV APKs
        run: |
          mkdir -p .kids-tv-build
          cp KidsVideoAndroid/app/build/outputs/apk/daughter/debug/app-daughter-debug.apk .kids-tv-build/Daughter-Video-TV-v3.3.apk
          cp KidsVideoAndroid/app/build/outputs/apk/son/debug/app-son-debug.apk .kids-tv-build/Son-Video-TV-v3.3.apk
          ls -lh .kids-tv-build

      - name: Upload Daughter TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Daughter-Video-TV-v3.3-APK
          path: .kids-tv-build/Daughter-Video-TV-v3.3.apk
          if-no-files-found: error

      - name: Upload Son TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Son-Video-TV-v3.3-APK
          path: .kids-tv-build/Son-Video-TV-v3.3.apk
          if-no-files-found: error
