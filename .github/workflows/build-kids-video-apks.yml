name: Build Kids Video APKs

on:
  push:
    branches: [ kids-video-build-20261016 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare stable family test signing key
        run: base64 --decode KidsVideoAndroid/app/kids-test.keystore.b64 > KidsVideoAndroid/app/kids-test.keystore

      - name: Build daughter and son debug APKs
        working-directory: KidsVideoAndroid
        run: gradle --no-daemon clean assembleDaughterDebug assembleSonDebug

      - name: Collect APKs
        run: |
          mkdir -p .kids-build/apks
          cp KidsVideoAndroid/app/build/outputs/apk/daughter/debug/app-daughter-debug.apk .kids-build/apks/Daughter-Video.apk
          cp KidsVideoAndroid/app/build/outputs/apk/son/debug/app-son-debug.apk .kids-build/apks/Son-Video.apk
          ls -lh .kids-build/apks

      - name: Upload Daughter APK
        uses: actions/upload-artifact@v4
        with:
          name: Daughter-Video-APK
          path: .kids-build/apks/Daughter-Video.apk
          if-no-files-found: error

      - name: Upload Son APK
        uses: actions/upload-artifact@v4
        with:
          name: Son-Video-APK
          path: .kids-build/apks/Son-Video.apk
          if-no-files-found: error
