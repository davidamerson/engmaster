plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kidsvideo.app'
    compileSdk 36

    signingConfigs {
        familyTest {
            storeFile file('kids-test.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "com.kidsvideo.tv"
        minSdk 26
        targetSdk 35
        versionCode 23
        versionName "3.3-tv"
        buildConfigField "String", "CHILD_PROFILE", '"daughter"'
        buildConfigField "String", "APP_DISPLAY_NAME", '"Video TV"'
    }

    buildFeatures { buildConfig true }
    flavorDimensions "child"

    productFlavors {
        daughter {
            dimension "child"
            applicationIdSuffix ".daughter"
            versionNameSuffix "-daughter"
            buildConfigField "String", "CHILD_PROFILE", '"daughter"'
            buildConfigField "String", "APP_DISPLAY_NAME", '"Video TV"'
            resValue "string", "app_name", "Video TV"
        }
        son {
            dimension "child"
            applicationIdSuffix ".son"
            versionNameSuffix "-son"
            buildConfigField "String", "CHILD_PROFILE", '"son"'
            buildConfigField "String", "APP_DISPLAY_NAME", '"Video Explore TV"'
            resValue "string", "app_name", "Video Explore TV"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.familyTest
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.github.bumptech.glide:glide:4.16.0"
}
