plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kidsvideo.app'
    compileSdk 35

    signingConfigs {
        familyTest {
            storeFile file('kids-test.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId "com.kidsvideo.app"
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName "1.3"
        buildConfigField "String", "CHILD_PROFILE", '"daughter"'
        buildConfigField "String", "APP_DISPLAY_NAME", '"Video"'
    }

    buildFeatures { buildConfig true }
    flavorDimensions "child"

    productFlavors {
        daughter {
            dimension "child"
            applicationIdSuffix ".daughter"
            versionNameSuffix "-daughter"
            buildConfigField "String", "CHILD_PROFILE", '"daughter"'
            buildConfigField "String", "APP_DISPLAY_NAME", '"Video"'
            resValue "string", "app_name", "Video"
        }
        son {
            dimension "child"
            applicationIdSuffix ".son"
            versionNameSuffix "-son"
            buildConfigField "String", "CHILD_PROFILE", '"son"'
            buildConfigField "String", "APP_DISPLAY_NAME", '"Video Explore"'
            resValue "string", "app_name", "Video Explore"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.familyTest
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.14.0"
}
