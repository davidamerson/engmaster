<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Video</title>
  <style>
    html,body{position:fixed;inset:0;margin:0;width:100%;height:100%;background:#000;overflow:hidden}
    #wrap,iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
  </style>
</head>
<body>
  <div id="wrap"></div>
  <script>
    (() => {
      const id=(new URLSearchParams(location.search).get('v')||'').trim();
      if(!/^[A-Za-z0-9_-]{11}$/.test(id)) return;
      const f=document.createElement('iframe');
      const params=new URLSearchParams({
        autoplay:'1',
        playsinline:'1',
        rel:'0',
        controls:'1',
        fs:'1',
        origin:location.origin,
        widget_referrer:location.href
      });
      f.src='https://www.youtube.com/embed/'+encodeURIComponent(id)+'?'+params.toString();
      f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';
      f.allowFullscreen=true;
      f.referrerPolicy='strict-origin-when-cross-origin';
      // Allow the YouTube player itself to run, but deny popup and top-level navigation
      // so clicking branding cannot turn this page into unrestricted YouTube browsing.
      f.setAttribute('sandbox','allow-scripts allow-same-origin allow-presentation');
      document.getElementById('wrap').appendChild(f);
    })();
  </script>
</body>
</html>
