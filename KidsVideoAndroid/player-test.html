<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Kids Video Player Test</title>
  <style>
    html,body,#player{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
    html,body{position:fixed;inset:0}
    iframe{position:fixed;inset:0;width:100%!important;height:100%!important;border:0}
    #status{position:fixed;left:12px;bottom:12px;z-index:5;color:#fff;background:#000a;padding:8px 10px;border-radius:8px;font:14px sans-serif}
  </style>
</head>
<body>
  <div id="player"></div>
  <div id="status">Loading hosted YouTube player…</div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    function onYouTubeIframeAPIReady(){
      player = new YT.Player('player', {
        videoId:'M7lc1UVf-VE',
        width:'100%', height:'100%',
        playerVars:{autoplay:1,playsinline:1,rel:0,controls:1,fs:1,origin:location.origin},
        events:{
          onReady:e=>{document.getElementById('status').textContent='Player ready • '+location.origin; try{e.target.playVideo()}catch(_){}},
          onStateChange:e=>{if(e.data===1) document.getElementById('status').style.display='none'},
          onError:e=>{document.getElementById('status').textContent='YouTube player error '+e.data+' • origin '+location.origin}
        }
      });
    }
  </script>
</body>
</html>
